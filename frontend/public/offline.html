<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#233414" />
    <title>Tidak Ada Koneksi — Koperasi Sinar Pagi Sejahtera</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
        background: #f4f5f1; color: #1a2610; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
      .card { max-width: 360px; text-align: center; background: #fff; border: 1px solid #dce1d6; border-radius: 24px; padding: 32px 24px; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 18px; margin: 18px 0 8px; }
      p { font-size: 14px; line-height: 1.6; color: #526046; margin: 0 0 20px; }
      button { background: #233414; color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 700; font-size: 14px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="Logo Koperasi" />
      <h1>Tidak ada koneksi internet</h1>
      <p>Periksa sinyal atau data seluler Anda. Pesanan dan data koperasi akan tampil lagi setelah tersambung.</p>
      <button onclick="location.reload()">Coba Lagi</button>
    </div>
  </body>
</html>
